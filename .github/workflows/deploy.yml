name: 自动部署到生产服务器

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-music-player
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: 同步文件至服务器
        run: |
          rsync -avzc --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} -o StrictHostKeyChecking=no" \
            --exclude='.git*' \
            --exclude='*.log' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/www/wwwroot/music.21212121.xyz/

      - name: 修复服务器权限
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT || 22 }} -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd /www/wwwroot/music.21212121.xyz
            chown -R www:www .
            chmod -R 755 .
            echo "音乐播放器 自动部署完成！"
          EOF
